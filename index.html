<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>vello-cam — caméra GPU</title>
<style>
  :root{--accent:#ddf693;--ink:#f7f8ed;--muted:#bcc8c3;--line:#ffffff26}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;background:#040c0d;color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  /* Same safe rectangle for the GPU canvas, its Rust coordinates and DOM labels. */
  #stage{position:fixed;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #gpu{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
  #cam{position:fixed;left:-8px;top:-8px;width:2px;height:2px;opacity:.01;pointer-events:none}
  #copy{display:none}
  .bar{position:absolute;left:20px;top:16px;right:76px;pointer-events:none}
  .brand{display:flex;align-items:baseline;gap:12px}
  .name{font-size:23px;font-weight:650;letter-spacing:-1px}
  .tag{font-size:9px;letter-spacing:2px;color:var(--accent)}
  .right{margin-top:4px;font-size:10px;color:var(--muted)}
  #hud{font-variant-numeric:tabular-nums;letter-spacing:1px}
  #stat{margin-top:5px;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .control{position:absolute;background:transparent;border:0;color:var(--ink);padding:0;
    font:500 10px/1 sans-serif;letter-spacing:.25px;text-align:center;pointer-events:none;
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;text-shadow:0 1px 5px #000}
  .control[aria-pressed=true]{color:var(--accent)}
  .control:focus-visible{outline:1px solid var(--accent);outline-offset:2px;border-radius:12px}
  #photo{color:transparent;text-shadow:none}
  .overlay{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:28px;
    background:#06100feb;backdrop-filter:blur(8px);z-index:5}
  .overlay.hide{display:none}
  .overlay h1{font-size:22px;margin:0 0 12px;font-weight:600}
  .overlay p{margin:0 0 20px;color:var(--muted);font-size:14px;max-width:44ch}
  .overlay code{background:#ffffff12;border-radius:6px;padding:2px 7px;font-size:12px}
  .overlay button{font:inherit;font-weight:600;color:#152214;background:var(--accent);border:0;
    border-radius:24px;min-height:48px;padding:12px 24px;cursor:pointer}
  .spinner{width:26px;height:26px;border:2px solid #ffffff26;border-top-color:var(--accent);
    border-radius:50%;margin:0 auto 22px;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-height:420px){#stat{display:none}.tag{display:none}}
</style>
</head>
<body>
  <div id="stage">
  <canvas id="gpu" aria-label="Aperçu caméra avec filtres GPU"></canvas>
  <div class="bar">
    <div class="brand"><span class="name">vello</span><span class="tag">CAMÉRA CRÉATIVE</span></div>
    <div class="right"><div id="hud">CAMÉRA · GPU</div><div id="stat" role="status" aria-live="polite">initialisation…</div></div>
  </div>
  <div role="group" aria-label="Filtres combinables et capture">
    <button class="control" id="mono" aria-label="Noir et blanc, touche 1" aria-pressed="false">N&amp;B</button>
    <button class="control" id="sepia" aria-label="Sépia, touche 2" aria-pressed="false">SÉPIA</button>
    <button class="control" id="blur" aria-label="Flou, touche 3" aria-pressed="false">FLOU</button>
    <button class="control" id="lens" aria-label="Fisheye, touche 4" aria-pressed="false">LENTILLE</button>
    <button class="control" id="vignette" aria-label="Vignette, touche 5" aria-pressed="false">VIGNETTE</button>
    <button class="control" id="prism" aria-label="Aberration chromatique, touche 6" aria-pressed="false">PRISME</button>
    <button class="control" id="photo" aria-label="Prendre une photo, Espace">PHOTO</button>
    <button class="control" id="record" aria-label="Démarrer ou arrêter la vidéo, R" aria-pressed="false">VIDÉO</button>
    <button class="control" id="grid" aria-label="Grille des tiers, G" aria-pressed="false">GRILLE</button>
    <button class="control" id="reset" aria-label="Réinitialiser les filtres, touche 0">RESET</button>
  </div>
  </div>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="copy"></canvas>

  <div class="overlay" id="boot">
    <div>
      <div class="spinner"></div>
      <h1>Chargement du moteur GPU…</h1>
      <p>Rust compilé en WebAssembly, rendu WebGPU. L'autorisation caméra va être demandée.</p>
    </div>
  </div>

  <div class="overlay hide" id="err">
    <div>
      <h1 id="errh">WebGPU indisponible</h1>
      <p id="errp">Ce navigateur n'expose pas <code>navigator.gpu</code>. Essaie Chrome ou Edge récents.</p>
      <button id="go" hidden>Démarrer la caméra</button>
    </div>
  </div>

<script>
/* ------------------------------------------------------------------ *
 *  Pont JS <-> Rust (Rust appelle ces fonctions par réflexion globale) *
 * ------------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);

function saveBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

window.velloCamStatus = (s) => { $('stat').textContent = s; };
window.velloCamHud    = (fps, w, h) => { $('hud').textContent = `${Math.round(fps)} fps · ${w}×${h}`; };
window.velloCamSource = () => {};
window.velloCamReady  = () => { $('boot').classList.add('hide'); };

/* photo : Rust relit les pixels côté GPU et nous passe un RGBA brut */
window.velloCamExportPhoto = (arr, w, h) => {
  const t0 = performance.now();
  const u8 = new Uint8Array(arr);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(u8.buffer), w, h), 0, 0);
  const t1 = performance.now();
  cv.toBlob((b) => {
    console.log(`[vello-cam] t=${performance.now().toFixed(0)} png=${b.size} (copie ${(t1-t0).toFixed(0)} ms, encodage ${(performance.now()-t1).toFixed(0)} ms)`);
    saveBlob(b, `vello-cam-${Date.now()}.png`);
    window.velloCamStatus('photo enregistrée');
  }, 'image/png');
};

/* vidéo : on capture le canvas WebGPU tel quel (filtres + UI compris) */
window.velloCamRecord = (on) => {
  const cv = $('gpu');
  if (on) {
    try {
      const types = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
      const mime = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
      const chunks = [];
      const rec = new MediaRecorder(cv.captureStream(60), mime ? { mimeType: mime } : undefined);
      rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      rec.onstop = () => saveBlob(new Blob(chunks, { type: mime || 'video/webm' }),
                                  `vello-cam-${Date.now()}.webm`);
      rec.start();
      window.__rec = rec;
      window.velloCamStatus('enregistrement…');
    } catch (e) { window.velloCamStatus('vidéo impossible : ' + e.name); }
  } else if (window.__rec) {
    window.__rec.stop();
    window.__rec = null;
    window.velloCamStatus('vidéo enregistrée');
  }
};

/* ------------------------------------------------------------------ *
 *  Caméra : le seul endroit en JS (contraintes + sonde de capacité)    *
 * ------------------------------------------------------------------ */
async function startCamera(){
  const v = $('cam');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:60}, facingMode:'user' },
      audio: false
    });
    v.srcObject = stream;
    await v.play();
    if (!v.videoWidth) {
      await new Promise((r) => v.addEventListener('loadedmetadata', r, { once:true }));
    }
    $('go').hidden = true;
    return true;
  } catch (e) {
    window.velloCamStatus('caméra refusée (' + e.name + ')');
    $('errh').textContent = 'Caméra indisponible';
    $('errp').innerHTML = 'Le navigateur a refusé l\'accès (' + e.name + '). Autorise la caméra, ' +
      'puis réessaie — ou ouvre la page sur <code>localhost</code> / une URL HTTPS.';
    $('go').hidden = false;
    $('err').classList.remove('hide');
    return false;
  }
}

/* Chromium/NVIDIA accepte de copier <video> directement en texture GPU.
   Certains backends (Dawn sur SwiftShader) refusent : on sonde, puis on choisit. */
async function probeDirectVideoCopy(){
  try {
    const ad = await navigator.gpu.requestAdapter();
    const dev = await ad.requestDevice();
    const v = $('cam');
    if (!v.videoWidth) return false;
    const t = dev.createTexture({ size:[16,16], format:'rgba8unorm', mipLevelCount:1, sampleCount:1,
      dimension:'2d',
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_DST | GPUTextureUsage.TEXTURE_BINDING });
    dev.pushErrorScope('validation');
    dev.queue.copyExternalImageToTexture({ source:v, flipY:false },
      { texture:t, mipLevel:0, origin:[0,0,0], aspect:'all', colorSpace:'srgb', premultipliedAlpha:false },
      [16,16]);
    const err = await dev.popErrorScope();
    return !err;
  } catch (e) { return false; }
}

/* Repli : le <video> est recopié chaque frame dans un canvas 2D, que le GPU lit. */
function startMirror(){
  const v = $('cam'), c = $('copy');
  c.width  = v.videoWidth  || 1280;
  c.height = v.videoHeight || 720;
  const ctx = c.getContext('2d', { alpha:false, desynchronized:true });
  const loop = () => { ctx.drawImage(v, 0, 0, c.width, c.height); requestAnimationFrame(loop); };
  loop();
}

$('go').addEventListener('click', async () => { await run(); });

/* ------------------------------------------------------------------ */
async function run(){
  if (!('gpu' in navigator)) {
    $('boot').classList.add('hide');
    $('err').classList.remove('hide');
    return;
  }
  const ok = await startCamera();
  let direct = false;
  if (ok) {
    direct = await probeDirectVideoCopy();
    if (!direct) startMirror();
  }
  window.velloCamDirectVideo = direct;
  window.velloCamStatus(ok
    ? (direct ? 'caméra prête · copie GPU directe' : 'caméra prête · repli copie 2D')
    : 'sans caméra');
  console.log('[vello-cam] copie video directe : ' + direct);

  try {
    const m = await import('./pkg/vello_cam.js');
    await m.default();
  } catch (e) {
    $('boot').classList.add('hide');
    $('errh').textContent = 'Erreur au chargement du WASM';
    $('errp').innerHTML = '<code>' + e + '</code>';
    $('err').classList.remove('hide');
  }
}
run();
</script>
</body>
</html>
