name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # La logique d'interface (mise en page, gestes) est du Rust pur : on peut la
      # tester sans navigateur ni GPU, alors que `cargo test` ne le peut pas.
      - name: Tester la logique d'interface
        run: ./scripts/test-ui-logic.sh

      # Binaire precompile : `cargo install wasm-pack` le compilerait, plusieurs minutes pour rien.
      - name: Installer wasm-pack
        run: |
          curl -sL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/wp.tgz
          tar xzf /tmp/wp.tgz -C /tmp
          cp /tmp/wasm-pack-*/wasm-pack /usr/local/bin/wasm-pack

      - name: Compiler en WebAssembly
        run: wasm-pack build --release --target web

      - name: Preparer le site
        run: |
          mkdir -p _site
          cp index.html serve.py _site/
          cp -r pkg _site/pkg

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
